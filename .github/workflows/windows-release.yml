name: Build Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.9,<7"
      - name: Test updater and settings migration
        run: python -m unittest discover -s tests -v
      - name: Build Windows EXE, installer and checksums
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python release_build.py --repository "$env:RELEASE_REPOSITORY"
      - name: Windows EXE startup smoke check
        shell: pwsh
        run: |
          $env:SC_CAPACITOR_DATA_DIR = Join-Path $env:RUNNER_TEMP "sc-capacitor-portable-check"
          $exe = Join-Path $PWD "dist/SC_Capacitor_Overlay.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Join-Path $PWD "dist") -PassThru
          try {
            if ($process.WaitForExit(12000)) { throw "The EXE exited during the startup smoke check." }
            if (Test-Path (Join-Path $env:SC_CAPACITOR_DATA_DIR "error_log.txt")) { throw (Get-Content (Join-Path $env:SC_CAPACITOR_DATA_DIR "error_log.txt") -Raw) }
            if ((Test-Path (Join-Path $env:SC_CAPACITOR_DATA_DIR "app_log.txt")) -and (Select-String -Path (Join-Path $env:SC_CAPACITOR_DATA_DIR "app_log.txt") -Pattern "Traceback" -Quiet)) { throw (Get-Content (Join-Path $env:SC_CAPACITOR_DATA_DIR "app_log.txt") -Raw) }
          } finally {
            if (-not $process.HasExited) { & taskkill.exe /PID $process.Id /T /F | Out-Null }
          }
      - name: Test installer, migration, shortcuts and uninstall
        shell: pwsh
        run: ./installer/smoke-test.ps1
      - name: Create a draft release with installer and update assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $release = Get-Content release-info.json | ConvertFrom-Json
          gh release create $release.tag "dist/SC_Capacitor_Overlay.exe" "dist/SC_Capacitor_Overlay.exe.sha256" "dist/SC-Capacitor-Setup.exe" "dist/SC-Capacitor-Setup.exe.sha256" --draft --target "$env:RELEASE_COMMIT" --title "SC Capacitor Overlay $($release.tag)" --notes "Glass Cockpit desktop app. New users: download SC-Capacitor-Setup.exe for guided installation and shortcuts. Existing users: run setup once to install, or keep using in-app updates. Settings are stored together in LocalAppData/SC Capacitor Overlay. The separate SC_Capacitor_Overlay.exe asset is retained for automatic updates."
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed. Use a new version number, or delete an unpublished failed draft before retrying." }
